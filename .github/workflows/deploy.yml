name: Deploy to AWS S3 + CloudFront

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The HTML references css/js/data by content-hash (?v=). If someone edits
      # those files without re-running the generator, the hashes in the committed
      # HTML go stale and cached clients keep old assets for a day. Fail fast.
      # (git add -A first so brand-new generator output also fails the diff.)
      - name: Verify committed HTML matches generator output
        run: |
          node generate-pages.js
          git add -A
          git diff --cached --exit-code

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # 1. Sync Images (Combined)
      # AWS CLI automatically detects correct content-types (image/png, image/webp) 
      # so you don't need separate steps. 
      - name: Sync Images (Immutable Cache)
        run: |
          aws s3 sync ./images s3://bulkplaintshirt.com/catalog/images/ \
            --delete \
            --size-only \
            --cache-control "public, max-age=31536000, immutable"

      # 2. Sync CSS, JS & Data
      # No --size-only here: a same-length edit must still upload. The HTML
      # references these files by content-hash (?v=), so day-long caching is safe
      # — a changed file ships under a new URL key on the same deploy.
      - name: Sync CSS, JS and Data
        run: |
          aws s3 sync ./css s3://bulkplaintshirt.com/catalog/css/ \
            --delete \
            --cache-control "public, max-age=86400"
          aws s3 sync ./js s3://bulkplaintshirt.com/catalog/js/ \
            --delete \
            --cache-control "public, max-age=86400"
          aws s3 sync ./data s3://bulkplaintshirt.com/catalog/data/ \
            --delete \
            --cache-control "public, max-age=86400"

      # 2b. Fresh asset bytes MUST be at the edge before any HTML referencing
      # their new ?v= keys goes live — otherwise a buyer can request style.css
      # with the new key, hit a stale CloudFront body, and Cloudflare pins that
      # stale body under the new key for hours with no way to purge it from here.
      - name: Invalidate assets and WAIT (before HTML goes live)
        run: |
          INV_ID=$(aws cloudfront create-invalidation \
            --distribution-id E21QLU9SBUBY7Z \
            --paths "/catalog/css/*" "/catalog/js/*" "/catalog/data/*" \
            --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id E21QLU9SBUBY7Z --id "$INV_ID"

      # 3. Sync Root & HTML Files (Aggressive cache invalidation for entry points)
      - name: Sync HTML and Root Configs
        run: |
          aws s3 sync . s3://bulkplaintshirt.com/catalog/ \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "generate-pages.js" \
            --exclude "scripts/*" \
            --exclude ".deploy-backup/*" \
            --exclude "cloudfront/*" \
            --exclude ".nojekyll" \
            --exclude "images/*" \
            --exclude "css/*" \
            --exclude "js/*" \
            --exclude "data/*" \
            --cache-control "no-cache, no-store, must-revalidate"

      # 4. Smart Invalidation
      # Cover directory URLs (e.g. /catalog/, /catalog/p/<slug>/) which don't end in .html,
      # plus all HTML, CSS, JS, JSON, and TXT entry points. Leave images cached at the edge.
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E21QLU9SBUBY7Z \
            --paths \
              "/catalog/" \
              "/catalog/index.html" \
              "/catalog/p/*" \
              "/catalog/*.html" \
              "/catalog/*.json" \
              "/catalog/*.txt" \
              "/catalog/*.xml" \
              "/catalog/.well-known/*"
